<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>automateclick</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="icon" href="../images/logo.png" />
</head>

<body>
  <main class="container">
    <header class="header">
      <div class="brand">
        <img class="logo" src="../images/logo.png" alt="automateclick logo" />
        <div>
          <h1>Automate Click</h1>
          <p>Simple browser automation</p>
        </div>
      </div>
    </header>

    <section class="status-card">
      <span id="status-dot" class="status-dot"></span>
      <div>
        <strong id="status">Ready</strong>
        <span id="status-description">Record your clicks to get started.</span>
      </div>
    </section>

    <section class="actions">
      <button id="record-btn" class="primary-btn">
        Record Clicks
      </button>

      <button id="start-btn" class="secondary-btn" disabled>
        Start Automation
      </button>

      <button id="stop-btn" class="danger-btn" disabled>
        Stop
      </button>
    </section>

    <section class="recording-info">
      <div class="info-header">
        <h2>Recorded Actions</h2>
        <div id="target-stepper" class="target-stepper">
          <button id="target-decrease" class="stepper-btn" type="button" aria-label="Decrease number of actions to record">−</button>
          <span id="action-count">0/2</span>
          <button id="target-increase" class="stepper-btn" type="button" aria-label="Increase number of actions to record">+</button>
        </div>
        <button id="clear-btn" class="clear-btn" type="button" hidden>Clear</button>
      </div>

      <div id="actions-list" class="actions-list">
        <p class="empty-state">
          No actions recorded yet.
        </p>
      </div>
    </section>

    <footer>
      <span>Created with <span class="heart">❤️</span> by <em><a href="https://github.com/mujtabacodes" target="_blank" rel="noopener noreferrer">Mujtaba</a></em></span>
      <span class="version">v1.0.0</span>
    </footer>
  </main>

  <script src="../scripts/popup.js"></script>
</body>
</html>
